<!-- Sign-up confirmation (B-17). The app asks for this code after sign-up (verifyOtp, type
     "signup"); the link is the fallback for opening the email on another device. Used by
     supabase/config.toml locally and by scripts/deploy.sh (auth step) on hosted projects. -->
<h2>Welcome to TripJunkies</h2>
<p>Your sign-up code is:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 4px">{{ .Token }}</p>
<p>Enter it in the app to finish signing up. It expires soon, so use it now.</p>
<p>Or <a href="{{ .ConfirmationURL }}">confirm your email with this link</a>.</p>
<p>If you didn't sign up for TripJunkies, you can ignore this email.</p>
