<!doctype html>
<!-- The service worker's last resort (M4-02) when even the precached Home shell is missing.
     Self-contained: no scripts or outside files, so it works with no network. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0B1F" />
    <title>TripJunkies · Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0e0b1f;
        color: #f5f0f9;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      .board {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 8px;
        background: #1c1740;
        color: #ffd23f;
        font:
          700 0.8rem/1.2 ui-monospace,
          monospace;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.5;
        color: #cfc8e6;
      }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 12px 24px;
        box-sizing: border-box;
        border-radius: 999px;
        background: #ff4f9a;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="board">FLIGHT MODE · NO SIGNAL</span>
      <h1>You're offline</h1>
      <p>This page needs a connection the first time you open it. Home works offline.</p>
      <a href="/">Go to Home</a>
    </main>
  </body>
</html>
