# M0-05 · CI pipeline.
#   web       install → typecheck → lint → unit tests → build → end-to-end smoke (signed out)
#   database  replays every migration onto the runner's Postgres and runs the pgTAP tests; checks the
#             committed schema snapshot is current (no Docker, see supabase/tests/README.md)
#   supabase  the same pgTAP tests on the real Supabase local stack (`supabase start` + real pgTAP),
#             which catches differences from the local stand-ins in scripts/db/, then the signed-in
#             browser tests in e2e/live against that stack
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Existing violations are recorded in eslint-suppressions.json; new ones fail. After fixing
      # some, run `npx eslint . --prune-suppressions` and commit the smaller file.
      - run: npx eslint . --quiet
      - run: bun run test
      - run: bun run build
      # The ubuntu-24.04 image already has Chrome's system libraries, so skip --with-deps (its
      # apt-get install took ~11 of the job's 14 minutes) and cache the browser download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npx playwright test
      # M4-02: a second build with the service worker on, served by `wrangler dev` (Workers runtime,
      # local only), then the offline tests in e2e/pwa.
      - run: npx playwright test -c playwright.pwa.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show Postgres version
        run: ls -d /usr/lib/postgresql/*/bin && pg_dump --version

      - name: Replay migrations, apply the seed, run pgTAP tests
        run: scripts/db/test.sh

      - name: Schema snapshot and inventory are up to date
        run: |
          REPLAY_HOOK='python3 scripts/db/inventory.py' scripts/db/replay-migrations.sh
          if ! git diff --exit-code -- supabase/baseline docs/inventory; then
            echo "::error::A migration changed the schema. Run: REPLAY_HOOK='python3 scripts/db/inventory.py' scripts/db/replay-migrations.sh and commit the result."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generated database types are up to date
        run: |
          scripts/db/gen-types.sh
          if ! git diff --exit-code -- src/integrations/supabase/types.ts; then
            echo "::error::A migration changed the database types. Run scripts/db/gen-types.sh and commit the result."
            exit 1
          fi

  supabase:
    name: Supabase local stack (real pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase start
      - run: supabase test db
      # Signed-in browser tests against this stack and its seed (e2e/live).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: npx playwright install chromium
        timeout-minutes: 5
      - name: Signed-in end-to-end tests (real stack)
        run: |
          supabase status -o env \
            --override-name api.url=VITE_SUPABASE_URL \
            --override-name auth.anon_key=VITE_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(VITE_SUPABASE_(URL|PUBLISHABLE_KEY)|SUPABASE_SERVICE_ROLE_KEY)=' | tr -d '"' >> "$GITHUB_ENV"
      - run: npx playwright test -c playwright.live.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live-traces
          path: test-results/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
